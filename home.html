<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoundAngles — Overzicht levels</title>

  <style>
    :root{
      --bg1:#1a0b2e; 
      --bg2:#3b0b4e; 
      --panel:#1d1233; 
      --ink:#f8f1ff; 
      --muted:#d7c8ef;
      --accent:#ff52d9; 
      --accent2:#a855f7; 
      --good:#22c55e; 
      --bad:#ef4444;
    }

    *{ box-sizing:border-box; }

    html, body{ height:100%; }

    body{
      margin:0;
      font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Arial,sans-serif;
      color:var(--ink);
      background:radial-gradient(1400px 800px at 70% -10%, var(--bg2) 0%, var(--bg1) 60%);
      display:flex;
      flex-direction:column;      /* NAV boven, inhoud eronder */
      align-items:center;
      justify-content:flex-start;
      padding:16px;
      min-height:100vh;
    }

    /* NAV-BALK BOVENAAN */
    .nav-buttons{
      display:flex;
      justify-content:center;
      gap:18px;
      padding:10px 16px 4px;
      width:100%;
      max-width:1100px;
    }

    .nav-buttons a{
      font-size:18px;
      font-weight:800;
      color:#ffffff;
      text-decoration:none;
      background:rgba(18,0,40,0.85);
      padding:10px 26px;
      border-radius:999px;
      letter-spacing:0.4px;
      border:1px solid rgba(255,255,255,0.16);
      box-shadow:0 8px 20px rgba(0,0,0,0.6);
      transition:0.2s ease;
    }

    .nav-buttons a:hover{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#120021;
      transform:translateY(-2px) scale(1.03);
    }

    /* INHOUD ---------------------------------------------------- */

      max-width:980px;
      width:100%;
      display:flex;
      flex-direction:column;
      gap:24px;
      margin-top:16px;
    }

    header{
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
    }
