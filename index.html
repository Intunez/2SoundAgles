<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>SoundAngles – Hoekenspel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Nunito", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at top, #34114d, #120021 60%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVIGATIEBALK BOVENAAN */
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 20px;
      background: url("images/podium_lay_out.png") center/cover no-repeat;
      border-bottom: 3px solid #ff4fd6;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .nav-buttons a {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      background: rgba(18, 0, 40, 0.78);
      padding: 10px 26px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      transition: 0.2s ease;
    }

    .nav-buttons a:hover {
      background: #ff4fd6;
      transform: translateY(-2px) scale(1.04);
    }

    /* MIDDENDEEL (WELKOMTEKST) */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px 40px;
    }

    .hero {
      max-width: 800px;
      text-align: center;
      background: rgba(8, 0, 20, 0.9);
      border-radius: 22px;
      padding: 30px 26px 36px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .hero h1 {
      font-size: clamp(26px, 3vw, 34px);
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .primary-btn,
    .secondary-btn {
      border: none;
      cursor: pointer;
      font-weight: 800;
      padding: 12px 26px;
      border-radius: 999px;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
      transition: 0.2s ease;
    }

    .primary-btn {
      background: linear-gradient(135deg, #ff4fd6, #ff9cf0);
      color: #120021;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6);
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.7);
    }

    .secondary-btn {
      background: #2e104b;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .secondary-btn:hover {
      background: #3d1764;
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      font-size: 12px;
      opacity: 0.7;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- NAVIGATIEBALK -->
  <div class="nav-buttons">
    <a href="intro.html">Intro</a>
    <a href="level1.html">Level 1</a>
    <a href="level2.html">Level 2</a>
  </div>

  <!-- WELKOMDEEL -->
  <main>
    <section class="hero">
      <h1>Welkom bij SoundAngles</h1>
      <p>
        In dit spel ontdek je met muziek welke hoeken bij elkaar horen.<br>
        Kies hieronder waar je wilt starten: eerst de uitleg, of meteen naar een level.
      </p>

      <div class="hero-buttons">
        <a href="intro.html" class="primary-btn">🎬 Start met de intro</a>
        <a href="level1.html" class="secondary-btn">Level 1 – Binnen / buiten</a>
        <a href="level2.html" class="secondary-btn">Level 2 – Soorten hoeken</a>
      </div>
    </section>
  </main>

  <footer>
    SoundAngles – hoekenspel met muziek
  </footer>

</body>
</html>
